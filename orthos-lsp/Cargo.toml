[package]
name = "orthos-lsp"
version = "0.1.0"
edition = "2021"
description = "Language Server Protocol implementation for Orthos"

[[bin]]
name = "orthos-lsp"
path = "src/main.rs"

[dependencies]
orthos-kernel = { path = "../orthos-kernel" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
z3 = "0.12"
